services:
  postgres:
    image: postgres:17
    container_name: appevents-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      # Only the first (default) database is created from POSTGRES_DB - appevents_test is
      # created by the init script below, since the app needs both (dev + integration tests).
      POSTGRES_DB: appevents_dev
    ports:
      - "5432:5432"
    volumes:
      - appevents_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: appevents-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP - matches Email:Host/Port in appsettings.Development.json, no auth needed
      - "8025:8025" # Web UI - open http://localhost:8025 to see emails sent by the app

volumes:
  appevents_pgdata:
