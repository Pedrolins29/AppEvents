services:
  postgres:
    image: postgres:17
    container_name: appevents-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: appevents_dev
    ports:
      - "5432:5432"
    volumes:
      - appevents_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: appevents-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP - matches Email:Host/Port in appsettings.Development.json
      - "8025:8025" # Web UI - open http://localhost:8025 to see emails

  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: appevents-omniroute
    restart: unless-stopped
    ports:
      - "20128:20128" # OmniRoute API (delivery routing optimization)
    volumes:
      - omniroute_data:/app/data # Persistent data for routes, optimization cache
    environment:
      # Optional: Add env vars if OmniRoute image supports them
      NODE_ENV: development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20128/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - postgres # OmniRoute can use PostgreSQL for persistence if needed

volumes:
  appevents_pgdata:
  omniroute_data: